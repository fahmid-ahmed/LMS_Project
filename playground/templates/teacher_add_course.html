{% extends 'base.html' %}

{% block title %}
Add Course
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">➕ Add New Course</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Course Code
                        </label>

                        <input
                            type="text"
                            name="course_code"
                            class="form-control"
                            placeholder="Example: CSE101"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Course Name
                        </label>

                        <input
                            type="text"
                            name="course_name"
                            class="form-control"
                            placeholder="Example: Introduction to Programming"
                            required
                        >
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Credit
                        </label>

                        <input
                            type="number"
                            name="credit"
                            class="form-control"
                            min="1"
                            max="6"
                            required
                        >
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Semester
                        </label>

                        <input
                            type="number"
                            name="semester"
                            class="form-control"
                            min="1"
                            max="12"
                            required
                        >
                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="5"
                        placeholder="Enter course description..."
                        required
                    ></textarea>

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Add Course
                    </button>

                    <a
                        href="{% url 'teacher_dashboard' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
